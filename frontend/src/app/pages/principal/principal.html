<ng-template
  #cabecalhoSecao
  let-indice="indice"
  let-titulo="titulo"
  let-destaque="destaque"
  let-id="id"
  let-complemento="complemento">

  <header class="principal-secao-cabecalho">
    <div class="principal-secao-identidade">
      <div class="principal-secao-indice">
        <span class="principal-secao-simbolo" aria-hidden="true">+</span>
        <span>{{ indice }}</span>
      </div>

      <h2 class="principal-secao-titulo" [id]="id">
        {{ titulo }} <span>{{ destaque }}</span>
      </h2>
    </div>

    <div class="principal-secao-complemento">
      <ng-container *ngTemplateOutlet="complemento"></ng-container>
    </div>
  </header>
</ng-template>

<main class="livraria-principal">
  <app-principal-abertura
    [livros]="livros"
    (livroSelecionado)="verDetalhes($event)">
  </app-principal-abertura>

  <app-principal-exploracao [cabecalhoSecao]="cabecalhoSecao"
    [livros]="livros"
    (catalogoSelecionado)="abrirCatalogo()"
    (autorSelecionado)="selecionarAutor($event)"
    (generoSelecionado)="selecionarGenero($event)">
  </app-principal-exploracao>


<app-principal-mais-vendidos [cabecalhoSecao]="cabecalhoSecao"
    [maisVendidos]="maisVendidos"
    [carregandoMaisVendidos]="carregandoMaisVendidos"
    (livroSelecionado)="verDetalhes($event)">
  </app-principal-mais-vendidos>


  <app-principal-descoberta-literaria [cabecalhoSecao]="cabecalhoSecao"
    [livros]="livros"
    (livroSelecionado)="verDetalhes($event)">
  </app-principal-descoberta-literaria>

  <app-principal-autores [cabecalhoSecao]="cabecalhoSecao"></app-principal-autores>

  <app-principal-catalogo [cabecalhoSecao]="cabecalhoSecao"
    [isLoggedIn]="isLoggedIn"
    [favoritosCount]="favoritosCount"
    [carrinhoItens]="carrinhoItens"
    [cuponsDisponiveisCount]="cuponsDisponiveisCount"
    [loading]="loading"
    [totalRecords]="totalRecords"
    [first]="first"
    [rows]="rows"
    [filteredLivros]="filteredLivros"
    [livrosPaginados]="livrosPaginados"
    [favoritosIds]="favoritosIds"
    [carregandoFiltro]="carregandoFiltro"
    [carregandoLimpar]="carregandoLimpar"
    [carregandoFavorito]="carregandoFavorito"
    [carregandoCarrinho]="carregandoCarrinho"
    [filtros]="filtros"
    [opcoesCategoriasCompartilhadas]="opcoesCategoriasCompartilhadas"
    [estoqueDisponivel]="consultarEstoque"
    [limiteAdicao]="consultarLimiteAdicao"
    [getTipoEstrelaPrincipal]="consultarTipoEstrela"
    [formatarNota]="consultarNota"
    (filtrosAplicados)="aplicarFiltros()"
    (filtrosLimpos)="limparFiltros()"
    (livroSelecionado)="verDetalhes($event)"
    (favoritoAlterado)="favoritar($event)"
    (livroAdicionado)="adicionarAoCarrinho($event)"
    (paginaAlterada)="onPageChange($event)"
    (atalhoSelecionado)="abrirAtalho($event)">
  </app-principal-catalogo>


<app-principal-detalhes-livro
    [displayDialog]="displayDialog"
    [selectedLivro]="selectedLivro"
    [isLoggedIn]="isLoggedIn"
    [favoritosIds]="favoritosIds"
    [carregandoFavorito]="carregandoFavorito"
    [carregandoCarrinhoModal]="carregandoCarrinhoModal"
    [estoqueDisponivel]="consultarEstoque"
    [limiteAdicao]="consultarLimiteAdicao"
    [formatarNota]="consultarNota"
    (fechar)="displayDialog = false"
    (favoritoAlterado)="favoritar($event)"
    (compraSolicitada)="adicionarAoCarrinhoComQuantidade($event.id, $event.quantidade)">
  </app-principal-detalhes-livro>


  <app-notificacao></app-notificacao>
</main>
