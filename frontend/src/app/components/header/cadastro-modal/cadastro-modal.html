<app-modal-base
  [visivel]="visible"
  largura="480px"
  [fecharAoClicarFora]="!loading"
  [fecharComEscape]="!loading"
  [bloqueado]="loading"
  (fechar)="fechar()">

  <app-modal-cabecalho
    titulo="Criar conta"
    subtitulo="Preencha os dados para se cadastrar"
    icone="pi pi-user-plus"
    (fechar)="fechar()"
    [desabilitarFechar]="loading">
  </app-modal-cabecalho>

  <app-modal-corpo>
    <div class="cadastro-modal-body">
      <div appGrupoCampo class="campo-autenticacao" rotulo="Nome completo" campoId="cadastro-modal-nome" obrigatorio>
        <input appCampo aparencia="autenticacao" id="cadastro-modal-nome" type="text" [(ngModel)]="nome" placeholder="Seu nome completo" class="auth-input" [disabled]="loading">
      </div>

      <div appGrupoCampo class="campo-autenticacao" rotulo="E-mail" campoId="cadastro-modal-email" obrigatorio>
        <input
          appCampo
          aparencia="autenticacao"
          id="cadastro-modal-email"
          type="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          class="auth-input"
          [disabled]="loading"
          (blur)="verificarEmail()"
          [class.input-invalido]="emailTocado && !validarEmail(email)"
          [invalido]="emailTocado && !validarEmail(email)"
          [descricaoId]="emailTocado && !validarEmail(email) ? 'cadastro-email-erro' : ''">

        <app-mensagem-validacao
          tipo="erro"
          mensagemId="cadastro-email-erro"
          [exibirIcone]="false"
          [visivel]="emailTocado && !validarEmail(email)"
          [mensagem]="email.trim() ? 'Informe um endereço de e-mail válido.' : 'O e-mail é obrigatório.'">
        </app-mensagem-validacao>
      </div>

      <div appGrupoCampo class="campo-autenticacao" rotulo="Senha" campoId="cadastro-modal-senha" obrigatorio>
        <app-campo-senha
          campoId="cadastro-modal-senha"
          rotulo="Senha"
          aparencia="autenticacao"
          autocomplete="new-password"
          [(ngModel)]="senha"
          placeholder="Crie uma senha"
          [disabled]="loading">
        </app-campo-senha>

        <app-forca-senha
          class="forca-autenticacao"
          [nivel]="nivelSenha"
          [nivelMaximo]="5"
          [requisitos]="requisitosSenha"
          [visivel]="senha.length > 0">
        </app-forca-senha>
      </div>

      <div appGrupoCampo class="campo-autenticacao" rotulo="Confirmar senha" campoId="cadastro-modal-confirmarSenha" obrigatorio>
        <app-campo-senha
          campoId="cadastro-modal-confirmarSenha"
          rotulo="Confirmar senha"
          aparencia="autenticacao"
          autocomplete="new-password"
          [(ngModel)]="confirmarSenha"
          placeholder="Confirme sua senha"
          (keyup.enter)="fazerCadastro()"
          [disabled]="loading">
        </app-campo-senha>
      </div>
    </div>
  </app-modal-corpo>

  <app-modal-rodape>
    <div class="cadastro-modal-footer">
      <button
        appBotao
        variante="primario"
        aparencia="autenticacao"
        tamanho="grande"
        icone="pi pi-user-plus"
        larguraTotal
        textoCarregando="Cadastrando..."
        [carregando]="loading"
        [desabilitado]="!formValido()"
        (click)="fazerCadastro()">
        Cadastrar
      </button>

      <div class="auth-register">
        <span>Já tem uma conta?</span>
        <button
          appBotao
          variante="link"
          aparencia="autenticacao"
          [desabilitado]="loading"
          (click)="abrirLogin()">
          Entre
        </button>
      </div>
    </div>
  </app-modal-rodape>
</app-modal-base>

<app-notificacao></app-notificacao>
