<app-modal-confirmacao
  [visivel]="visible"
  titulo="Sair da conta"
  mensagem="Você será desconectado e precisará fazer login novamente."
  icone="pi pi-sign-out"
  variante="perigo"
  largura="380px"
  textoCancelar="Cancelar"
  textoConfirmar="Sair"
  iconeCancelar="pi pi-times"
  iconeConfirmar="pi pi-sign-out"
  textoCarregando="Saindo..."
  [carregando]="loading"
  [bloquearComOverlay]="true"
  (cancelar)="fechar()"
  (confirmar)="confirmarLogout()">
</app-modal-confirmacao>
