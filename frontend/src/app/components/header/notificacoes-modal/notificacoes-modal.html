<app-modal-base
  [visivel]="visible"
  largura="600px"
  alturaMaxima="85vh"
  rotulo="Notificações"
  (fechar)="fechar()">

  <app-modal-cabecalho
    titulo="Notificações"
    subtitulo="Fique por dentro de tudo que acontece"
    icone="pi pi-bell"
    (fechar)="fechar()">
  </app-modal-cabecalho>

  <app-modal-corpo rolagemInterna>
    <div class="notificacoes-conteudo">

      <div *ngIf="loading" class="notificacoes-carregamento">
        <app-carregamento
          modelo="simples"
          texto="Carregando notificações...">
        </app-carregamento>
      </div>

      <div
        *ngIf="!loading && notificacoes.length === 0"
        class="notificacoes-vazio">
        <app-estado-vazio
          icone="pi pi-bell"
          titulo="Nenhuma notificação"
          descricao="Você não tem notificações no momento">
        </app-estado-vazio>
      </div>

      <div
        *ngIf="!loading && notificacoes.length > 0"
        class="notificacoes-list">

        <div
          *ngFor="let notificacao of notificacoes"
          class="notificacao-item"
          [class.lida]="notificacao.lida"
          [ngClass]="'notificacao-' + (notificacao.tipo || 'info')"
          (click)="marcarComoLida(notificacao.id)">

          <div class="notificacao-icon">
            <i
              *ngIf="notificacao.tipo === 'success'"
              class="pi pi-check-circle"
              style="color: #22c55e;">
            </i>

            <i
              *ngIf="notificacao.tipo === 'error'"
              class="pi pi-times-circle"
              style="color: #dc2626;">
            </i>

            <i
              *ngIf="notificacao.tipo === 'warning'"
              class="pi pi-exclamation-triangle"
              style="color: #eab308;">
            </i>

            <i
              *ngIf="!notificacao.tipo || !['success', 'error', 'warning'].includes(notificacao.tipo)"
              class="pi pi-info-circle"
              style="color: #3b82f6;">
            </i>
          </div>

          <div class="notificacao-content">
            <div class="notificacao-header">
              <h4>{{ notificacao.titulo }}</h4>

              <span class="notificacao-data">
                {{ notificacao.data | date:'dd/MM/yyyy HH:mm' }}
              </span>
            </div>

            <p>{{ notificacao.mensagem }}</p>
          </div>

          <button
            *ngIf="!notificacao.lida"
            appBotao
            class="acao-leitura notificacao-acao"
            variante="secundario"
            icone="pi pi-check-circle"
            [desabilitado]="loading"
            title="Marcar como lida"
            aria-label="Marcar notificação como lida"
            (click)="$event.stopPropagation(); marcarComoLida(notificacao.id)">
            Ler
          </button>
        </div>
      </div>
    </div>
  </app-modal-corpo>

  <app-modal-rodape
    *ngIf="notificacoes.length > 0 && !loading"
    separador>

    <button
      appBotao
      class="acao-perigo-contorno"
      variante="perigo"
      icone="pi pi-trash"
      larguraTotal
      (click)="limparTodas()">
      Limpar todas
    </button>

  </app-modal-rodape>
</app-modal-base>

<app-notificacao></app-notificacao>
