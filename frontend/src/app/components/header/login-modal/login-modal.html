<app-modal-base
  [visivel]="visible"
  largura="480px"
  [fecharAoClicarFora]="!loading"
  [fecharComEscape]="!loading"
  (fechar)="fechar()">

  <app-modal-cabecalho
    titulo="Bem-vindo de volta"
    subtitulo="Acesse sua conta para continuar"
    icone="pi pi-user"
    (fechar)="fechar()"
    [desabilitarFechar]="loading">
  </app-modal-cabecalho>

  <app-modal-corpo>
    <div class="login-modal-body">
      <div appGrupoCampo class="campo-autenticacao" rotulo="E-mail" campoId="login-modal-email">
        <input
          appCampo
          aparencia="autenticacao"
          id="login-modal-email"
          type="email"
          [(ngModel)]="email"
          placeholder="seu@email.com"
          class="auth-input"
          [class.carregado]="dadosCarregados && email"
          [class.preencher]="dadosCarregados"
          [disabled]="loading">
      </div>

      <div appGrupoCampo class="campo-autenticacao" rotulo="Senha" campoId="login-modal-senha">
        <app-campo-senha
          campoId="login-modal-senha"
          rotulo="Senha"
          aparencia="autenticacao"
          autocomplete="current-password"
          [(ngModel)]="senha"
          placeholder="Digite sua senha"
          (keyup.enter)="fazerLogin()"
          [disabled]="loading">
        </app-campo-senha>
      </div>

      <div class="auth-options">
        <label class="remember-me">
          <input
            type="checkbox"
            [(ngModel)]="lembrarMe"
            [disabled]="loading"
            class="controle-selecao-compartilhado">
          Lembrar-me
        </label>

        <a class="forgot-password">Esqueceu a senha?</a>
      </div>
    </div>
  </app-modal-corpo>

  <app-modal-rodape>
    <div class="login-modal-footer">
      <button
        appBotao
        variante="primario"
        aparencia="autenticacao"
        tamanho="grande"
        icone="pi pi-sign-in"
        larguraTotal
        textoCarregando="Entrando..."
        [carregando]="loading"
        [desabilitado]="!formValido()"
        (click)="fazerLogin()">
        Entrar
      </button>

      <div class="auth-register">
        <span>Não tem uma conta?</span>

        <button
          appBotao
          variante="link"
          aparencia="autenticacao"
          [desabilitado]="loading"
          (click)="abrirCadastro()">
          Cadastre-se
        </button>
      </div>
    </div>
  </app-modal-rodape>
</app-modal-base>

<app-notificacao></app-notificacao>
