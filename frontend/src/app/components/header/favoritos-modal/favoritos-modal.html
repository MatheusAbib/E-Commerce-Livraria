<app-modal-base
  [visivel]="visible"
  largura="600px"
  alturaMaxima="85vh"
  rotulo="Meus Favoritos"
  (fechar)="fechar()">

  <app-modal-cabecalho
    titulo="Meus Favoritos"
    subtitulo="Seus livros favoritos salvos"
    icone="pi pi-heart"
    (fechar)="fechar()">
  </app-modal-cabecalho>

  <app-modal-corpo rolagemInterna>
    <div class="favoritos-conteudo">
      <app-carregamento
        *ngIf="loading"
        texto="Carregando favoritos..."
        modelo="aneis">
      </app-carregamento>

      <ng-container *ngIf="!loading">
        <div *ngIf="favoritos.length === 0" class="favoritos-vazio">
          <app-estado-vazio
            icone="pi pi-heart"
            titulo="Nenhum favorito"
            descricao="Você ainda não adicionou livros aos favoritos">
          </app-estado-vazio>
        </div>

        <div *ngIf="favoritos.length > 0" class="favoritos-grid">
          <div
            *ngFor="let livro of favoritos"
            class="favorito-card"
            [class.card-problema]="!livro.ativo || estoqueDisponivel(livro) <= 0"
            (click)="verDetalhes(livro.id)">

            <img
              [src]="livro.imagemUrl ? '/uploads/' + livro.imagemUrl : 'https://via.placeholder.com/60x80?text=Sem+Imagem'"
              [alt]="livro.titulo">

            <div class="favorito-info">
              <div class="favorito-titulo">
                <h4>{{ livro.titulo }}</h4>

                <span
                  *ngIf="!livro.ativo"
                  class="status-inativo-fav">
                  INATIVO
                </span>

                <span
                  *ngIf="livro.ativo && estoqueDisponivel(livro) <= 0"
                  class="status-esgotado-fav">
                  ESGOTADO
                </span>
              </div>

              <p>{{ livro.autor || 'Autor desconhecido' }}</p>

              <span class="favorito-preco">
                R$ {{ livro.precoVenda || 0 | number:'1.2-2' }}
              </span>
            </div>

            <div class="favorito-actions">
              <button
                appBotaoIcone
                class="acao-lista"
                icone="pi pi-eye"
                rotulo="Ver detalhes"
                (click)="$event.stopPropagation(); verDetalhes(livro.id)">
              </button>

              <button
                appBotaoIcone
                class="acao-lista acao-remover"
                icone="pi pi-heart-fill"
                rotulo="Remover dos favoritos"
                [desabilitado]="carregandoRemover[livro.id]"
                (click)="$event.stopPropagation(); removerFavorito(livro.id)">
              </button>

              <button
                appBotaoIcone
                class="acao-lista acao-adicionar"
                icone="pi pi-cart-plus"
                rotulo="Adicionar ao carrinho"
                [desabilitado]="!livro.ativo || estoqueDisponivel(livro) <= 0 || carregandoCarrinho[livro.id] || carrinhoService.obterQuantidadeLivro(livro.id) >= 3"
                (click)="$event.stopPropagation(); adicionarAoCarrinho(livro.id)">
              </button>
            </div>
          </div>
        </div>
      </ng-container>
    </div>
  </app-modal-corpo>
</app-modal-base>

<app-notificacao></app-notificacao>
