<app-modal-base
  [visivel]="visible"
  largura="600px"
  alturaMaxima="90vh"
  rotulo="Meus Chats"
  (fechar)="fechar()">

  <app-modal-cabecalho
    titulo="Meus Chats"
    subtitulo="Conversas com o vendedor"
    icone="pi pi-comment"
    (fechar)="fechar()">
  </app-modal-cabecalho>

  <app-modal-corpo rolagemInterna>
    <div class="chats-conteudo">

      <app-carregamento
        *ngIf="carregandoChats"
        texto="Carregando conversas..."
        modelo="aneis">
      </app-carregamento>

      <ng-container *ngIf="!carregandoChats">

        <div class="chats-tabs">
          <button
            type="button"
            class="chats-tab"
            [class.active]="chatsTabAtivo === 'ativos'"
            (click)="chatsTabAtivo = 'ativos'">
            Ativos
            <span
              *ngIf="chatsAtivos.length > 0"
              class="tab-badge">
              {{ chatsAtivos.length }}
            </span>
          </button>

          <button
            type="button"
            class="chats-tab"
            [class.active]="chatsTabAtivo === 'encerrados'"
            (click)="chatsTabAtivo = 'encerrados'">
            Encerrados
            <span
              *ngIf="chatsEncerrados.length > 0"
              class="tab-badge">
              {{ chatsEncerrados.length }}
            </span>
          </button>
        </div>

        <div
          *ngIf="chatsAtivos.length === 0 && chatsTabAtivo === 'ativos'"
          class="chats-vazio">
          <app-estado-vazio
            icone="pi pi-inbox"
            titulo="Nenhuma conversa ativa"
            descricao="Você não tem conversas ativas no momento">
          </app-estado-vazio>
        </div>

        <div
          *ngIf="chatsEncerrados.length === 0 && chatsTabAtivo === 'encerrados'"
          class="chats-vazio">
          <app-estado-vazio
            icone="pi pi-inbox"
            titulo="Nenhuma conversa encerrada"
            descricao="Você não tem conversas encerradas">
          </app-estado-vazio>
        </div>

        <div *ngIf="chatsTabAtivo === 'ativos'">
          <div
            *ngFor="let chat of chatsAtivos"
            class="chat-item"
            (click)="selecionarChat(chat.pedidoId)">

            <div class="chat-item-info">
              <span class="chat-item-pedido">
                Pedido #{{ chat.pedidoId }}
              </span>

              <span class="chat-item-ultima">
                {{ chat.ultimaMensagem | slice:0:40 }}{{ chat.ultimaMensagem?.length > 40 ? '...' : '' }}
              </span>
            </div>

            <span
              *ngIf="chat.naoLidas > 0"
              class="chat-item-badge">
              {{ chat.naoLidas }}
            </span>

            <i class="pi pi-chevron-right"></i>
          </div>
        </div>

        <div *ngIf="chatsTabAtivo === 'encerrados'">
          <div
            *ngFor="let chat of chatsEncerrados"
            class="chat-item"
            (click)="selecionarChat(chat.pedidoId)">

            <div class="chat-item-info">
              <span class="chat-item-pedido">
                Pedido #{{ chat.pedidoId }}
              </span>

              <span class="chat-item-ultima">
                {{ chat.ultimaMensagem | slice:0:40 }}{{ chat.ultimaMensagem?.length > 40 ? '...' : '' }}
              </span>
            </div>

            <span class="chat-item-status">
              Encerrado
            </span>

            <i class="pi pi-chevron-right"></i>
          </div>
        </div>

      </ng-container>
    </div>
  </app-modal-corpo>
</app-modal-base>
