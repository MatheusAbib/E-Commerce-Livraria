<div
  class="campo-quantidade"
  role="group"
  [attr.aria-label]="rotulo"
  [attr.aria-busy]="carregando">

  <button
    appBotaoIcone
    class="quantidade-controle"
    variante="neutro"
    icone="pi pi-minus"
    rotulo="Diminuir quantidade"
    [desabilitado]="!podeDecrementar"
    (click)="decrementar()"
    (blur)="marcarTocado()">
  </button>

  <output
    class="quantidade-valor"
    aria-live="polite"
    [attr.aria-label]="rotulo + ': ' + valor">
    @if (carregando) {
      <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      <span class="sr-only">Atualizando quantidade</span>
    } @else {
      {{ valor }}
    }
  </output>

  <button
    appBotaoIcone
    class="quantidade-controle"
    variante="neutro"
    icone="pi pi-plus"
    rotulo="Aumentar quantidade"
    [desabilitado]="!podeIncrementar"
    (click)="incrementar()"
    (blur)="marcarTocado()">
  </button>
</div>
